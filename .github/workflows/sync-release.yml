name: Sync Android release

# This repository owns its own tag + release. The workflow watches the build
# repository (Shivaay20005/ShivaayMusic-main), pulls the tested Android assets
# from its newest release, verifies the SHA-256 checksums, publishes the tag,
# and deletes every older release/tag so only the newest version remains.
#
# No secret is required: the build repository is public, and publishing here
# uses this repository's own GITHUB_TOKEN. The schedule is what makes this
# automatic after every successful build.
on:
  schedule:
    - cron: '*/10 * * * *'
  repository_dispatch:
    types: [shivaaymusic-android-sync]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sync (e.g. 1.0.14). Empty = newest source release.'
        required: false
        type: string
      force:
        description: 'Re-upload the assets even if this release already looks complete'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-android-release
  cancel-in-progress: false

env:
  SOURCE_REPO: Shivaay20005/ShivaayMusic-main
  GH_TOKEN: ${{ github.token }}
  REQUESTED_VERSION: ${{ github.event.client_payload.version || inputs.version || '' }}
  FORCE: ${{ github.event.client_payload.force || inputs.force || 'false' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the newest source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION}"
          if [[ -z "$version" ]]; then
            version="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${SOURCE_REPO}/releases/latest" \
              | sed -n 's/.*"tag_name": *"v\{0,1\}\([^"]*\)".*/\1/p' | head -n1)"
          fi
          if [[ -z "$version" ]]; then
            echo "No published release in ${SOURCE_REPO} yet; nothing to sync."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::Expected x.y.z, got '${version}'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Syncing Android release ${version}"

      - name: Check whether this version is already complete
        id: state
        if: steps.version.outputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          assets="$(gh release view "$version" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || true)"
          complete=true
          for name in \
            "ShivaayMusic-v${version}-Android-arm64-v8a.apk" \
            "ShivaayMusic-v${version}-Android-armeabi-v7a.apk" \
            "ShivaayMusic-v${version}-Android-x86_64.apk" \
            "ShivaayMusic-v${version}-Android-Universal.apk" \
            "ShivaayMusic-v${version}-Android.aab" \
            "ShivaayMusic-v${version}-SHA256SUMS-Android.txt"; do
            [[ "$assets" == *"$name"* ]] || complete=false
          done
          if [[ "$complete" == "true" && "$FORCE" != "true" ]]; then
            echo "Release ${version} already has every asset; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify the Android assets
        if: steps.version.outputs.version != '' && steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p assets
          for attempt in $(seq 1 20); do
            if gh release download "v${version}" --repo "$SOURCE_REPO" \
                 --pattern "ShivaayMusic-v${version}-*" --dir assets --clobber; then
              break
            fi
            echo "Source release not ready (attempt ${attempt}/20); waiting 15s"
            sleep 15
          done
          for name in \
            "ShivaayMusic-v${version}-Android-arm64-v8a.apk" \
            "ShivaayMusic-v${version}-Android-armeabi-v7a.apk" \
            "ShivaayMusic-v${version}-Android-x86_64.apk" \
            "ShivaayMusic-v${version}-Android-Universal.apk" \
            "ShivaayMusic-v${version}-Android.aab" \
            "ShivaayMusic-v${version}-SHA256SUMS-Android.txt"; do
            test -f "assets/${name}" || { echo "::error title=Missing asset::${name}"; exit 1; }
          done
          (cd assets && tr -d '\r' < "ShivaayMusic-v${version}-SHA256SUMS-Android.txt" | sha256sum -c -)

      - name: Publish this version as the only release
        if: steps.version.outputs.version != '' && steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          # Old releases/tags go first. The release for VERSION itself is
          # never touched, so a re-run repairs it in place.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '.[].tagName' 2>/dev/null |
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$version" ]] && continue
            echo "Deleting old release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
          gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' 2>/dev/null |
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$version" ]] && continue
            [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            echo "Deleting old tag $tag"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" >/dev/null 2>&1 || true
          done

          if ! gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$version" --repo "$GITHUB_REPOSITORY" \
              --title "ShivaayMusic v${version}" \
              --notes "ShivaayMusic v${version} - Android APK/AAB, built and tested in ${SOURCE_REPO}." \
              --latest
            sleep 3
          fi

          shopt -s nullglob
          for file in assets/*; do
            name="$(basename "$file")"
            asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${version}" \
              --jq ".assets[] | select(.name == \"${name}\") | .id" 2>/dev/null | head -n1 || true)"
            [[ -n "$asset_id" ]] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
            for attempt in 1 2 3; do
              if gh release upload "$version" "$file" --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              [[ $attempt -eq 3 ]] && { echo "::error title=Upload failed::${name}"; exit 1; }
              sleep 5
            done
          done
          gh release edit "$version" --repo "$GITHUB_REPOSITORY" --latest
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/tags/${version}" \
            -f draft=false -f prerelease=false >/dev/null

      - name: Verify the download URL
        if: steps.version.outputs.version != '' && steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/ShivaayMusic-v${version}-Android-arm64-v8a.apk"
          code="$(curl -sL -o /dev/null -w '%{http_code}' -r 0-1023 "$url")"
          echo "HTTP ${code} ${url}"
          [[ "$code" == "200" || "$code" == "206" ]]
